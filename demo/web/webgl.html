<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>WebGL check</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; color: #cfd8e8;
               font: 14px/1.5 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 14px; top: 12px; z-index: 2; white-space: pre; }
</style>
</head>
<body>
<div id="hud">初期化中…</div>
<canvas id="gl"></canvas>
<script>
// three.js を挟まない素の WebGL。回転する三角形を描くだけ。
// 「WebGL のコンテキストが取れて、実際に GPU で描けているか」だけを見る。
const hud = document.getElementById('hud');
const canvas = document.getElementById('gl');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
if (!gl) {
  hud.textContent = 'WebGL コンテキストが取れない';
  godot.emit('webgl', { ok: false, reason: 'no context' });
} else {
  const version = gl.getParameter(gl.VERSION);
  const renderer = gl.getParameter(gl.RENDERER);
  hud.textContent = version + '\n' + renderer;

  const vs = `attribute vec2 p; uniform float t; varying vec3 c;
    void main() {
      float s = sin(t), k = cos(t);
      gl_Position = vec4(mat2(k, -s, s, k) * p, 0.0, 1.0);
      c = vec3(p * 0.5 + 0.5, 0.8);
    }`;
  const fs = `precision mediump float; varying vec3 c;
    void main() { gl_FragColor = vec4(c, 1.0); }`;

  function shader(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  }

  const program = gl.createProgram();
  gl.attachShader(program, shader(gl.VERTEX_SHADER, vs));
  gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(program);
  gl.useProgram(program);

  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0.7, -0.7, -0.5, 0.7, -0.5]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(program, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const time = gl.getUniformLocation(program, 't');

  let frames = 0;
  function draw(now) {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.02, 0.03, 0.05, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(time, now * 0.001);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    frames += 1;
    if (frames === 60) {
      godot.emit('webgl', { ok: true, version: version, renderer: renderer });
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}
</script>
</body>
</html>
