[package]
name = "godot-servo"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-4"] }
servo = { version = "0.5.0", features = ["webgpu"] }
surfman = { version = "0.13.0", features = ["chains"] }
glow = "0.17"
gleam = "0.15"
euclid = "0.22"
image = { version = "0.25", default-features = false }
dpi = "0.1"
url = "2.5"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
# ANGLE 経路の feature は Windows でのみ立てる。servo の `no-wgl` は
# `mozangle/egl` を引き、mozangle の build.rs は非 Windows でその feature が
# 立っていると panic する ("Do not know how to build EGL support for a
# non-Windows platform.")。cargo は同じ依存をターゲット別に書けて、feature は
# ターゲットが一致したときだけ合算される。
servo = { version = "0.5.0", features = ["no-wgl"] }
surfman = { version = "0.13.0", features = ["sm-angle-default"] }

windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_LibraryLoader",
] }
wio = "0.2"
winapi = { version = "0.3", features = ["d3d11"] }

[target.'cfg(target_os = "linux")'.dependencies]
# jemalloc を dlopen 可能な TLS モデルで作らせる。
#
# Servo は servo-allocator 経由で jemalloc を使う。jemalloc は既定で initial-exec
# の TLS を使うため、リンク結果に STATIC_TLS フラグが立ち、PT_TLS が glibc の
# 静的 TLS 余剰 (既定 1664 バイト) を超える。GDExtension は dlopen されるので
# Godot が読み込めず `cannot allocate memory in static TLS block` になる。
#
# ここでは使わないが、直接依存に書くと cargo が feature を合算するので、
# servo-allocator が引く同じ jemalloc に効く。
tikv-jemalloc-sys = { version = "0.6.1", features = ["disable_initial_exec_tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-metal = "0.3.2"
objc2-io-surface = { version = "0.3.2", features = ["std"] }
objc2-foundation = "0.3.2"
