[package]
name = "godot-servo"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-4"] }
servo = { version = "0.5.0", features = ["no-wgl", "webgpu"] }
surfman = { version = "0.13.0", features = ["chains", "sm-angle-default"] }
glow = "0.17"
gleam = "0.15"
euclid = "0.22"
image = { version = "0.25", default-features = false }
dpi = "0.1"
url = "2.5"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_LibraryLoader",
] }
wio = "0.2"
winapi = { version = "0.3", features = ["d3d11"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-metal = "0.3.2"
objc2-io-surface = { version = "0.3.2", features = ["std"] }
objc2-foundation = "0.3.2"
