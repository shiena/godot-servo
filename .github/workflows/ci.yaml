name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting can be checked without building any dependency, so it gets its own
  # fast job.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # gdtoolkit parses GDScript on its own, so the demo's scripts can be checked
  # without Godot or a built addon. Which rules apply is in .gdlintrc.
  gdscript:
    name: Lint GDScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install gdtoolkit
        run: python3 -m pip install --quiet "gdtoolkit==4.*"
      - name: Run gdlint
        run: python3 -m gdtoolkit.linter $(git ls-files '*.gd')

  windows:
    name: Build and self check (Windows)
    runs-on: windows-latest
    # Building Servo from scratch takes an hour or so. The ceiling sits a little
    # above that, so a stalled self check cannot hold a runner for the default six.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Save the cache on failure too. The default is false, but what fails here is
      # our own code or scripts, by which point Servo and ANGLE are already built.
      # Without saving, every run rebuilds them for an hour while the failure lasts.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # clippy and the build go through one call, on the same debug profile.
      # Building Servo on a cold cache takes over an hour, so CI never stacks a
      # release build on top of a debug one. Release is for releases.
      - name: Lint, build, and stage the addon
        shell: pwsh
        run: ./scripts/build.ps1 -Checks

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      # Importing is its own step. Combined, there is no telling which one stalled.
      - name: Import the project
        shell: pwsh
        timeout-minutes: 10
        run: godot --headless --path . --import

      # With no GPU on the runner this falls back to CPU readback. The input and
      # signal checks pass either way.
      - name: Self check
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/build.ps1 -NoBuild -Test -Godot godot -TimeoutSeconds 300

      - uses: actions/upload-artifact@v4
        with:
          name: godot_servo-windows
          path: addons/godot_servo/bin/windows/
          if-no-files-found: error

  # Checks that the build is not broken. Running on hardware happens separately.
  unix:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libgl1-mesa-dev \
            libssl-dev libdbus-1-dev libudev-dev libfontconfig1-dev

      - name: Build and stage the addon
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: godot_servo-${{ matrix.os }}
          path: addons/godot_servo/bin/
          if-no-files-found: error

  # All three renderers share GPU memory, by two routes: an AHardwareBuffer as an
  # ExternalTexture under Compatibility, and a VkImage shared through an fd under
  # Forward+ and Mobile.
  # Only arm64-v8a is built. x86_64 Android survives on emulators and ChromeOS and
  # little else, and neither the export preset nor the release covers it.
  android:
    name: Build (Android arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # The runner has ANDROID_NDK_ROOT as a real environment variable.
      # `${{ env.* }}` only sees the workflow's own env, so copy it across here.
      - name: Build and stage the addon
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          # Android alone is built in release. A debug .so is 1.5 GB, far past
          # what an APK can carry.
          ./scripts/build.sh --release --android

      - uses: actions/upload-artifact@v4
        with:
          name: godot_servo-android-arm64-v8a
          path: addons/godot_servo/bin/android/
          if-no-files-found: error
