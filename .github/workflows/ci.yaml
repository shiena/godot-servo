name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 書式だけは依存をビルドせずに見られるので、速い足を分けておく。
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  windows:
    name: Build and self check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # 失敗時もキャッシュを保存する。既定は false だが、この構成では落ちるのは
      # 自分のコードかスクリプトで、Servo と ANGLE のビルドはその手前で終わって
      # いる。保存しないと失敗が続く限り毎回 1 時間かけて作り直すことになる。
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # clippy とビルドを 1 回の呼び出しにまとめ、同じ debug プロファイルで回す。
      # Servo のビルドはキャッシュが冷えていると 1 時間を超えるので、CI で
      # release と debug の両方を積むのは避ける。release はリリース時だけ。
      - name: Lint, build, and stage the addon
        shell: pwsh
        run: ./scripts/build.ps1 -Checks

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      # ランナーに GPU が無ければ CPU リードバック経路に落ちる。入力とシグナルの
      # 検証はどちらの経路でも通る。
      - name: Self check
        shell: pwsh
        run: |
          godot --headless --path . --import
          ./scripts/build.ps1 -NoBuild -Test -Godot godot

      - uses: actions/upload-artifact@v4
        with:
          name: godot_servo-windows
          path: addons/godot_servo/bin/windows/
          if-no-files-found: error

  # ビルドが壊れていないかを見る。実機での確認は別途行う。
  unix:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libgl1-mesa-dev \
            libssl-dev libdbus-1-dev libudev-dev libfontconfig1-dev

      - name: Build and stage the addon
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: godot_servo-${{ matrix.os }}
          path: addons/godot_servo/bin/
          if-no-files-found: error

  # GPU 共有 (AHardwareBuffer) は Compatibility レンダラでのみ成立し、
  # Forward+ / Mobile では CPU リードバックに落ちる。
  android:
    name: Build (Android ${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # ランナーは ANDROID_NDK_ROOT を実際の環境変数として持っている。
      # `${{ env.* }}` はワークフローの env しか見ないので、ここで移し替える。
      - name: Build and stage the addon
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          # Android だけ release で作る。debug の .so は 1.5 GB あり、
          # APK に載せられる大きさではない。
          ./scripts/build.sh --release --android --abi ${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: godot_servo-android-${{ matrix.abi }}
          path: addons/godot_servo/bin/android/
          if-no-files-found: error
