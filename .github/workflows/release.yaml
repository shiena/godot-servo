name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize version
        id: normalize
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="v${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Reject an existing tag
        run: |
          if git rev-parse "refs/tags/${{ steps.normalize.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.normalize.outputs.version }} already exists."
            exit 1
          fi

  build-windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set crate version
        shell: pwsh
        run: |
          $version = '${{ needs.prepare.outputs.version }}'.TrimStart('v')
          (Get-Content Cargo.toml) -replace '^version = ".*"', "version = `"$version`"" |
            Set-Content Cargo.toml
          cargo update --workspace

      - name: Build and stage the addon
        shell: pwsh
        run: ./scripts/build.ps1 -Release

      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: addons/godot_servo/bin/windows/
          if-no-files-found: error

  build-unix:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libgl1-mesa-dev \
            libssl-dev libdbus-1-dev libudev-dev libfontconfig1-dev

      - name: Set crate version
        run: |
          version="${{ needs.prepare.outputs.version }}"
          sed -i.bak "s/^version = \".*\"/version = \"${version#v}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          cargo update --workspace

      - name: Build and stage the addon
        run: ./scripts/build.sh --release

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: addons/godot_servo/bin/${{ matrix.platform }}/
          if-no-files-found: error

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set crate version
        run: |
          version="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${version#v}\"/" Cargo.toml
          cargo update --workspace

      - name: Build and stage the addon
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          ./scripts/build.sh --release --android

      - uses: actions/upload-artifact@v4
        with:
          name: bin-android
          path: addons/godot_servo/bin/android/
          if-no-files-found: error

  package:
    needs: [prepare, build-windows, build-unix, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staged

      # The archive is shaped so that dropping it into a project just works. It
      # holds one thing, addons/godot_servo/, so merging addons/ installs it.
      - name: Assemble the addon package
        run: |
          NAME="godot-servo-${{ needs.prepare.outputs.version }}"
          mkdir -p "$NAME/addons/godot_servo"
          cp addons/godot_servo/README.md "$NAME/addons/godot_servo/"
          # The .gdextension goes inside the addon. Its res:// paths are absolute,
          # so the file itself can sit anywhere. A second copy at the root would
          # register the same extension twice, so keep exactly one.
          cp godot_servo.gdextension godot_servo.gdextension.uid "$NAME/addons/godot_servo/"
          cp README.md README_ja.md LICENSE* "$NAME/" 2>/dev/null || true
          # Every platform the manifest names has to be here. A missing one used to
          # be skipped silently, which shipped a Windows-only archive whose
          # .gdextension still pointed at libraries for the others.
          # Android nests one level deeper, under its ABI.
          for platform in windows macos linux android; do
            src="staged/bin-$platform"
            [ -d "$src" ] || { echo "::error::no artifact for $platform"; exit 1; }
            mkdir -p "$NAME/addons/godot_servo/bin/$platform"
            cp -r "$src/." "$NAME/addons/godot_servo/bin/$platform/"
          done
          find "$NAME/addons/godot_servo/bin" -type f | sort
          zip -r "$NAME.zip" "$NAME"
          echo "ARCHIVE=$NAME.zip" >> "$GITHUB_ENV"

      # A demo that runs as it is: the addon plus the demo scenes and pages.
      - name: Assemble the demo project
        run: |
          NAME="godot-servo-demo-${{ needs.prepare.outputs.version }}"
          SRC="godot-servo-${{ needs.prepare.outputs.version }}"
          cp -r "$SRC" "$NAME"
          cp project.godot "$NAME/"
          cp -r demo "$NAME/"
          mkdir -p "$NAME/.godot"
          echo 'res://addons/godot_servo/godot_servo.gdextension' > "$NAME/.godot/extension_list.cfg"
          zip -r "$NAME.zip" "$NAME"
          echo "DEMO_ARCHIVE=$NAME.zip" >> "$GITHUB_ENV"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.prepare.outputs.version }}" \
            --title "${{ needs.prepare.outputs.version }}" \
            --generate-notes \
            "$ARCHIVE" "$DEMO_ARCHIVE"
