name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize version
        id: normalize
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="v${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Reject an existing tag
        run: |
          if git rev-parse "refs/tags/${{ steps.normalize.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.normalize.outputs.version }} already exists."
            exit 1
          fi

      # The version is written once, here. Every build job takes Cargo.toml and
      # Cargo.lock from this artifact rather than editing its own copy, so the four
      # of them cannot disagree about what was built, and `package` commits the very
      # files the binaries came from.
      - name: Set the crate version
        run: |
          version="${{ steps.normalize.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${version#v}\"/" Cargo.toml
          # Carry the bump into the lockfile as well, so it cannot drift from Cargo.toml.
          cargo update --workspace
          grep -m1 '^version' Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: version-commit
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error

  build-windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # After rust-cache on purpose. It keys its cache on Cargo.lock, so bumping the
      # version first would miss the cache and rebuild Servo from scratch.
      - name: Apply the version bump
        uses: actions/download-artifact@v8
        with:
          name: version-commit

      - name: Build and stage the addon
        shell: pwsh
        run: ./scripts/build.ps1 -Release

      - uses: actions/upload-artifact@v7
        with:
          name: bin-windows
          path: addons/godot_servo/bin/windows/
          if-no-files-found: error

  build-unix:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libgl1-mesa-dev \
            libssl-dev libdbus-1-dev libudev-dev libfontconfig1-dev

      # After rust-cache on purpose. It keys its cache on Cargo.lock, so bumping the
      # version first would miss the cache and rebuild Servo from scratch.
      - name: Apply the version bump
        uses: actions/download-artifact@v8
        with:
          name: version-commit

      - name: Build and stage the addon
        run: ./scripts/build.sh --release

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.platform }}
          path: addons/godot_servo/bin/${{ matrix.platform }}/
          if-no-files-found: error

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # After rust-cache on purpose. It keys its cache on Cargo.lock, so bumping the
      # version first would miss the cache and rebuild Servo from scratch.
      - name: Apply the version bump
        uses: actions/download-artifact@v8
        with:
          name: version-commit

      - name: Build and stage the addon
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          ./scripts/build.sh --release --android

      - uses: actions/upload-artifact@v7
        with:
          name: bin-android
          path: addons/godot_servo/bin/android/
          if-no-files-found: error

  package:
    needs: [prepare, build-windows, build-unix, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Full history: this job pushes, and a shallow clone is not a reliable thing
      # to push from.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: staged

      # The version the binaries were actually built with goes back onto main. It is
      # the only commit a release makes. No tag is pushed here: `gh release create`
      # below makes one, and it lands on main's head, which is this commit.
      - name: Commit the version bump
        run: |
          cp staged/version-commit/Cargo.toml Cargo.toml
          cp staged/version-commit/Cargo.lock Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "Already at ${{ needs.prepare.outputs.version }}; nothing to commit."
          else
            git commit -m "Release ${{ needs.prepare.outputs.version }}"
            git push origin main
          fi

      # The archive holds one thing, addons/godot_servo/, and the zip starts at
      # addons/ so there is no wrapper directory to strip. The Asset Store asks
      # for that structure so an install cannot land files beside the project's
      # own, and it asks for the licence to travel with the asset — which is why
      # both texts go inside the addon folder rather than staying at the root.
      - name: Assemble the addon package
        run: |
          NAME="godot-servo-${{ needs.prepare.outputs.version }}"
          mkdir -p "$NAME/addons/godot_servo"
          cp addons/godot_servo/README.md addons/godot_servo/icon.svg \
            LICENSE-APACHE LICENSE-MIT "$NAME/addons/godot_servo/"
          # The .gdextension goes inside the addon. Its res:// paths are absolute,
          # so the file itself can sit anywhere. A second copy at the root would
          # register the same extension twice, so keep exactly one.
          cp godot_servo.gdextension godot_servo.gdextension.uid "$NAME/addons/godot_servo/"
          # Every platform the manifest names has to be here. A missing one used to
          # be skipped silently, which shipped a Windows-only archive whose
          # .gdextension still pointed at libraries for the others.
          # Android nests one level deeper, under its ABI.
          for platform in windows macos linux android; do
            src="staged/bin-$platform"
            [ -d "$src" ] || { echo "::error::no artifact for $platform"; exit 1; }
            mkdir -p "$NAME/addons/godot_servo/bin/$platform"
            cp -r "$src/." "$NAME/addons/godot_servo/bin/$platform/"
          done
          find "$NAME/addons/godot_servo/bin" -type f | sort
          ( cd "$NAME" && zip -r "../$NAME.zip" addons )
          echo "ARCHIVE=$NAME.zip" >> "$GITHUB_ENV"

      # A demo that runs as it is: the addon plus the demo scenes and pages.
      # This one is a whole project rather than something to merge, so it keeps
      # the wrapper directory and carries the repository's own docs at its root.
      - name: Assemble the demo project
        run: |
          NAME="godot-servo-demo-${{ needs.prepare.outputs.version }}"
          SRC="godot-servo-${{ needs.prepare.outputs.version }}"
          cp -r "$SRC" "$NAME"
          cp project.godot README.md README_ja.md LICENSE-APACHE LICENSE-MIT "$NAME/"
          cp -r demo "$NAME/"
          mkdir -p "$NAME/.godot"
          echo 'res://addons/godot_servo/godot_servo.gdextension' > "$NAME/.godot/extension_list.cfg"
          zip -r "$NAME.zip" "$NAME"
          echo "DEMO_ARCHIVE=$NAME.zip" >> "$GITHUB_ENV"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.prepare.outputs.version }}" \
            --title "${{ needs.prepare.outputs.version }}" \
            --generate-notes \
            "$ARCHIVE" "$DEMO_ARCHIVE"
